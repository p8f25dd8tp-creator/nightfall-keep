<html lang="de">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2308100e' d='M0 0h64v64H0z'/%3E%3Cpath fill='%23e9b45c' d='M13 11h10v10h18V11h10v42H13z'/%3E%3Cpath fill='%23913c35' d='m32 25 10 9-4 18H26l-4-18z'/%3E%3C/svg%3E" />
  <style>
    :root{--gold:#f1bd64;--red:#c85445;--ink:#070b0b;--panel:rgba(8,14,13,.84);--line:rgba(240,195,113,.24);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d;touch-action:none}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
    button{font:inherit;color:inherit;border:0;cursor:pointer}
    .hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;justify-content:space-between}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .brand{display:flex;gap:9px;align-items:center;text-shadow:0 2px 8px #000}.crest{width:38px;height:42px;background:linear-gradient(#e7b55f,#9f592c);clip-path:polygon(10% 0,90% 0,82% 74%,50% 100%,18% 74%);display:grid;place-items:center;color:#251409;font-weight:1000;font-size:19px;border:1px solid #ffe6a6}.brand b{font-family:Georgia,serif;letter-spacing:.11em;font-size:15px}.brand small{display:block;color:#d5c6a7;font-size:10px;letter-spacing:.12em;margin-top:2px}
    .resources{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{background:linear-gradient(180deg,rgba(20,28,25,.94),rgba(6,11,10,.94));border:1px solid var(--line);box-shadow:0 4px 18px #0008;border-radius:18px;padding:7px 10px;font-size:13px;font-weight:800;min-width:64px;text-align:center}.pill span{margin-right:5px}
    .phase{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);width:min(68vw,320px);text-align:center;text-shadow:0 2px 8px #000}.phase strong{font-family:Georgia,serif;font-size:15px;letter-spacing:.18em}.bar{height:5px;background:#0008;border-radius:8px;margin-top:6px;overflow:hidden;border:1px solid #ffffff15}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e6b25a,#ffdb83);transition:width .25s linear}.night .bar i{background:linear-gradient(90deg,#8e3b78,#d44b4b)}
    .objective{align-self:center;background:rgba(5,9,8,.72);border:1px solid #ffffff16;border-radius:20px;padding:7px 13px;font-size:12px;color:#eadfc9;text-shadow:0 2px 4px #000;backdrop-filter:blur(7px);margin-top:68px}
    .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.left-actions,.right-actions{pointer-events:auto;display:flex;align-items:flex-end;gap:8px}.right-actions{flex-direction:column;align-items:flex-end}.speeds{display:flex;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 5px 20px #0008}.speeds button{min-width:34px;height:30px;border-radius:9px;background:transparent;font-size:12px;font-weight:900}.speeds button.on{background:#d7a857;color:#21160b}.action{height:50px;min-width:50px;padding:0 13px;border-radius:15px;background:linear-gradient(160deg,#334238,#15201c);border:1px solid #7f9c8166;box-shadow:0 7px 20px #0009,inset 0 1px #ffffff16;font-size:18px;font-weight:900;pointer-events:auto}.action:active,.build:active{transform:scale(.96)}.action small{display:block;font-size:9px;color:#d7cfbd}.start-night{background:linear-gradient(160deg,#9e4839,#52231f);border-color:#e97a64;min-width:112px;font-size:12px;letter-spacing:.06em}.buildbar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 13px);transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto}.build{position:relative;width:64px;height:60px;border-radius:16px;background:linear-gradient(160deg,#25342d,#101916);border:1px solid #c79e5c55;box-shadow:0 8px 24px #000a;color:#f4e8cf;font-size:22px}.build.selected{outline:2px solid var(--gold);box-shadow:0 0 25px #d9a44a66}.build small{display:block;font-size:9px;margin-top:2px;color:#d5c4a5}.cost{position:absolute;right:-3px;top:-6px;background:#4a2f1f;border:1px solid #b9854f;border-radius:10px;padding:2px 5px;font-size:9px}
    .joystick{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom) + 84px);width:116px;height:116px;border-radius:50%;border:1px solid #ffffff1e;background:radial-gradient(circle,#ffffff0c 0 36%,#00000030 38% 100%);pointer-events:none;opacity:.82}.stick{position:absolute;width:48px;height:48px;left:34px;top:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d7bc85,#6d5a3a);border:2px solid #ffe4a566;box-shadow:0 4px 15px #0009}
    .screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 50% 28%,rgba(27,54,42,.45),rgba(2,5,5,.94));padding:26px;text-align:center}.screen.hidden,.levelup.hidden,.toast.hidden{display:none}.rune{width:96px;height:108px;margin:auto;background:linear-gradient(145deg,#f1c16b,#8a4727);clip-path:polygon(12% 0,88% 0,82% 74%,50% 100%,18% 74%);display:grid;place-items:center;font:900 42px Georgia;filter:drop-shadow(0 14px 28px #000)}.screen h1{font:900 clamp(34px,10vw,62px) Georgia,serif;letter-spacing:.08em;margin:20px 0 4px;text-shadow:0 6px 30px #000}.screen p{color:#d6cbb7;max-width:340px;line-height:1.5;margin:0 auto 24px;font-size:14px}.primary{min-width:210px;padding:15px 24px;border-radius:14px;background:linear-gradient(#f0bf68,#af672f);color:#251407;font-weight:1000;letter-spacing:.09em;box-shadow:0 10px 34px #000, inset 0 1px #fff7;border:1px solid #ffdc8d}.hint{font-size:11px!important;margin-top:16px!important;color:#938b7d!important}
    .levelup{position:fixed;z-index:12;inset:0;background:#020605d9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}.levelup h2{font:900 27px Georgia;margin:0 0 6px;color:#f3c36f}.levelup p{margin:0 0 18px;color:#bfb4a2;font-size:13px}.cards{width:min(100%,520px);display:grid;gap:10px}.card{text-align:left;padding:15px 16px;border-radius:16px;background:linear-gradient(135deg,#26362f,#101815);border:1px solid #d9aa5d55;box-shadow:0 8px 25px #0008}.card b{color:#f5d69b;display:block;margin-bottom:3px}.card span{font-size:12px;color:#c8c1b3}.toast{position:fixed;z-index:20;left:50%;top:42%;transform:translate(-50%,-50%);font:900 28px Georgia;color:#ffe3a5;text-shadow:0 3px 10px #000,0 0 30px #dd713c;letter-spacing:.08em;pointer-events:none;animation:toast 1.2s both}@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1.05)}}
    @media (max-width:430px){.brand b{font-size:12px}.crest{width:31px;height:35px}.pill{padding:6px 8px;min-width:54px;font-size:12px}.buildbar{bottom:calc(env(safe-area-inset-bottom) + 9px);gap:5px}.build{width:58px;height:56px}.build small{font-size:8px}.cost{font-size:8px}.joystick{bottom:calc(env(safe-area-inset-bottom) + 79px);left:15px}.objective{font-size:11px}.hud{padding-left:8px;padding-right:8px}}
    @media (orientation:landscape) and (max-height:520px){.phase{top:12px}.objective{margin-top:8px}.joystick{bottom:18px}.buildbar{bottom:12px}.brand small{display:none}}
  </style>

<body>
  <canvas id="game" aria-label="Spielfeld"></canvas>
  <div class="hud" id="hud">
    <div>
      <div class="top">
        <div class="brand"><div class="crest">N</div><div><b>NIGHTFALL</b><small>KEEP · NACHT <em id="nightNo">1</em></small></div></div>
        <div class="resources"><div class="pill"><span>🪙</span><b id="gold">120</b></div><div class="pill"><span>✦</span><b id="level">1</b></div></div>
      </div>
      <div class="phase" id="phase"><strong id="phaseName">TAGESLICHT</strong><div class="bar"><i id="phaseBar"></i></div></div>
      <div class="objective" id="objective">Sammle Ressourcen und verstärke den Hof</div>
    </div>
    <div class="bottom">
      <div class="left-actions"></div>
      <div class="right-actions">
        <div class="speeds"><button data-speed="1" class="on">×1</button><button data-speed="2">×2</button><button data-speed="3">×3</button></div>
        <button class="action start-night" id="startNight">NACHT STARTEN</button>
      </div>
    </div>
  </div>
  <div class="buildbar" id="buildbar">
    <button class="build" data-build="wall">🛡️<small>Palisade</small><i class="cost">25🪙</i></button>
    <button class="build" data-build="tower">🏹<small>Wachturm</small><i class="cost">60🪙</i></button>
    <button class="build" data-build="fire">🔥<small>Feuerstelle</small><i class="cost">45🪙</i></button>
    <button class="build" data-build="house">🏠<small>Haus</small><i class="cost">35🪙</i></button>
    <button class="build" data-build="mill">🌾<small>Mühle</small><i class="cost">70🪙</i></button>
  </div>
  <div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
  <div class="screen" id="start">
    <div><div class="rune">N</div><h1>NIGHTFALL<br>KEEP</h1><p>Baue bei Tag. Kämpfe bei Nacht. Jede Mauer, jeder Turm und jeder Treffer zählt.</p><button class="primary" id="play">FESTUNG BETRETEN</button><p class="hint">Linker Daumen: bewegen · Held greift automatisch an</p></div>
  </div>
  <div class="levelup hidden" id="levelup"><h2>STÄRKER GEWORDEN</h2><p>Wähle einen Segen für diese Nacht</p><div class="cards" id="cards"></div></div>
  <div class="toast hidden" id="toast"></div>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d'); let W,H,D=1,last=0,running=false,paused=false,speed=1,phase='day',phaseTime=38,night=1,shake=0,buildMode=null;
const ui={gold:$('#gold'),level:$('#level'),night:$('#nightNo'),phase:$('#phase'),phaseName:$('#phaseName'),bar:$('#phaseBar'),objective:$('#objective'),startNight:$('#startNight'),buildbar:$('#buildbar'),levelup:$('#levelup'),cards:$('#cards'),toast:$('#toast')};
function $(q){return document.querySelector(q)} function all(q){return [...document.querySelectorAll(q)]}
const state={gold:120,xp:0,lvl:1,kills:0,upgrades:[]};
const hero={x:-550,y:-330,r:17,hp:100,max:100,speed:175,damage:22,rate:.62,cd:0,range:84,angle:0,flash:0};
const keep={x:-650,y:-470,r:64,hp:300,max:300};
const zoom=.72;
const routes=[[[1000,-650],[400,-620],[-100,-520],[-540,-470]], [[-650,950],[-620,350],[-660,-20],[-610,-390]], [[1050,720],[480,360],[-80,-80],[-540,-440]]];
let enemies=[],shots=[],particles=[],numbers=[],buildings=[],nodes=[],decor=[];
const joy={active:false,id:null,x:0,y:0,dx:0,dy:0}; const keys={};
function resetWorld(){nodes=[];decor=[];for(let i=0;i<46;i++){let a=Math.random()*Math.PI*2,d=180+Math.random()*760;nodes.push({x:Math.cos(a)*d,y:Math.sin(a)*d,type:Math.random()<.7?'tree':'rock',hp:1,active:true,pulse:Math.random()*6})}for(let i=0;i<90;i++)decor.push({x:(Math.random()-.5)*1700,y:(Math.random()-.5)*1700,s:Math.random()*2+1,c:Math.random()});}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)} addEventListener('resize',resize);resize();resetWorld();
function world(sx,sy){return{x:(sx-W/2)/zoom+hero.x,y:(sy-H*.48)/zoom+hero.y}}
function screen(wx,wy){return{x:wx-hero.x+W/2,y:wy-hero.y+H*.48}}
function toast(t){ui.toast.textContent=t;ui.toast.classList.remove('hidden');void ui.toast.offsetWidth;setTimeout(()=>ui.toast.classList.add('hidden'),1150)}
function save(){localStorage.setItem('nightfall-save',JSON.stringify({night,state,buildings,keepHp:keep.hp,hero:{damage:hero.damage,speed:hero.speed,rate:hero.rate,range:hero.range,max:hero.max}}))}
function load(){try{let s=JSON.parse(localStorage.getItem('nightfall-save'));if(!s)return;night=s.night||1;Object.assign(state,s.state||{});buildings=s.buildings||[];keep.hp=s.keepHp||300;if(s.hero)Object.assign(hero,s.hero)}catch(e){}}
function updateUI(){ui.gold.textContent=Math.floor(state.gold);ui.level.textContent=state.lvl;ui.night.textContent=night;ui.phase.classList.toggle('night',phase==='night');ui.phaseName.textContent=phase==='day'?'TAGESLICHT':'NACHT '+night;ui.bar.style.width=(phase==='day'?phaseTime/38:enemies.length?Math.max(8,enemies.length/(8+night*3)*100):0)+'%';ui.startNight.style.display=phase==='day'?'block':'none';ui.buildbar.style.display=phase==='day'?'flex':'none';ui.objective.textContent=phase==='day'?(buildMode?'Tippe auf den Hof, um zu bauen':'Gold: Häuser und Mühlen produzieren · Gegner lassen Gold fallen'):(enemies.length?'Drei Wege führen zum Bergfried · '+enemies.length+' Feinde':'Die letzten Schatten fallen…')}
function startNight(){if(phase==='night')return;phase='night';buildMode=null;all('.build').forEach(b=>b.classList.remove('selected'));toast('NACHT '+night);let count=8+night*3;for(let i=0;i<count;i++)spawnEnemy(i===count-1&&night%3===0);updateUI()}
function spawnEnemy(boss=false){let lane=Math.floor(Math.random()*routes.length),path=routes[lane],start=path[0];enemies.push({x:start[0]+(Math.random()-.5)*35,y:start[1]+(Math.random()-.5)*35,route:path.slice(1),routeIndex:0,r:boss?32:13+Math.random()*4,hp:boss?260+night*60:38+night*9,max:boss?260+night*60:38+night*9,speed:boss?34:48+Math.random()*16,damage:boss?28:8+night*.7,cd:0,flash:0,boss,phase:Math.random()*6,dead:false})}
function daybreak(){phase='day';night++;phaseTime=38;hero.hp=Math.min(hero.max,hero.hp+35);keep.hp=Math.min(keep.max,keep.hp+45);toast('MORGENRÖTE');save();updateUI()}
function burst(px,py,color,n=8){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,life:.35+Math.random()*.35,max:.7,color,size:2+Math.random()*4})}
function damageNum(px,py,v,color='#fff'){numbers.push({x:px,y:py,v:Math.round(v),life:.75,color})}
function hitEnemy(e,dmg){e.hp-=dmg;e.flash=.12;shake=Math.max(shake,3);burst(e.x,e.y,e.boss?'#e05e45':'#bb3e36',6);damageNum(e.x,e.y-e.r,dmg,'#ffd08a');if(e.hp<=0&&!e.dead){e.dead=true;state.kills++;state.gold+=e.boss?45:8;state.xp+=e.boss?80:10;if(state.xp>=state.lvl*45){state.xp-=state.lvl*45;state.lvl++;paused=true;showLevel()}save()}}
function showLevel(){let opts=[['Geschärfte Klinge','+30 % Schaden',()=>hero.damage*=1.3],['Windschritt','+18 % Bewegung',()=>hero.speed*=1.18],['Eichenherz','+35 Leben und Heilung',()=>{hero.max+=35;hero.hp=hero.max}],['Schnelle Hand','+22 % Angriffstempo',()=>hero.rate*=.78],['Weite Schneide','+24 % Reichweite',()=>hero.range*=1.24]];opts.sort(()=>Math.random()-.5);ui.cards.innerHTML='';opts.slice(0,3).forEach(o=>{let b=document.createElement('button');b.className='card';b.innerHTML='<b>'+o[0]+'</b><span>'+o[1]+' · bleibt dauerhaft</span>';b.onclick=()=>{o[2]();state.upgrades.push(o[0]);save();ui.levelup.classList.add('hidden');paused=false};ui.cards.appendChild(b)});ui.levelup.classList.remove('hidden')}
function buildAt(p){let cfg={wall:{gold:25,r:28,hp:150},tower:{gold:60,r:23,hp:95},fire:{gold:45,r:22,hp:80},house:{gold:35,r:25,hp:100},mill:{gold:70,r:29,hp:135}}[buildMode];if(!cfg)return;if(state.gold<cfg.gold){toast('NICHT GENUG GOLD');return}if(Math.hypot(p.x-keep.x,p.y-keep.y)>360||Math.hypot(p.x-keep.x,p.y-keep.y)<105){toast('NÄHER AM BERGFRIED BAUEN');return}if(buildings.some(b=>Math.hypot(p.x-b.x,p.y-b.y)<b.r+cfg.r+12)){toast('PLATZ BELEGT');return}state.gold-=cfg.gold;buildings.push({x:p.x,y:p.y,type:buildMode,r:cfg.r,hp:cfg.hp,max:cfg.hp,cd:0,level:1});burst(p.x,p.y,'#d7b36d',18);shake=5;save();updateUI()}
function upgradeAt(p){let b=buildings.find(v=>Math.hypot(p.x-v.x,p.y-v.y)<v.r+16);if(!b)return false;if(b.level>=3){toast('MAXIMALE STUFE');return true}let cost=20*b.level;if(state.gold<cost){toast('UPGRADE: '+cost+' GOLD');return true}state.gold-=cost;b.level++;b.max=Math.round(b.max*1.55);b.hp=b.max;b.r+=2;burst(b.x,b.y,'#ffe29a',24);toast('STUFE '+b.level);save();updateUI();return true}
function gather(dt){for(const n of nodes){if(!n.active)continue;let d=Math.hypot(hero.x-n.x,hero.y-n.y);if(d<48){n.hp-=dt;if(Math.random()<dt*9)burst(n.x,n.y,n.type==='tree'?'#84a65b':'#a8a49a',1);if(n.hp<=0){n.active=false;if(n.type==='tree')state.wood+=7;else state.stone+=6;toast(n.type==='tree'?'+7 HOLZ':'+6 STEIN');updateUI()}}}}
function update(dt){if(!running||paused)return;dt=Math.min(dt,.04)*speed;let mx=joy.dx,my=joy.dy;if(keys.w||keys.ArrowUp)my=-1;if(keys.s||keys.ArrowDown)my=1;if(keys.a||keys.ArrowLeft)mx=-1;if(keys.d||keys.ArrowRight)mx=1;let ml=Math.hypot(mx,my);if(ml>.05){mx/=Math.max(1,ml);my/=Math.max(1,ml);hero.x+=mx*hero.speed*dt;hero.y+=my*hero.speed*dt;hero.angle=Math.atan2(my,mx)}hero.x=Math.max(-790,Math.min(790,hero.x));hero.y=Math.max(-790,Math.min(790,hero.y));hero.flash=Math.max(0,hero.flash-dt);
 if(phase==='day'){phaseTime-=dt;gather(dt);for(const b of buildings)if(b.type==='house')state.gold+=1.5*b.level*dt;else if(b.type==='mill')state.gold+=4*b.level*dt;if(phaseTime<=0)startNight()}else{
  hero.cd-=dt;let target=null,td=1e9;for(const e of enemies){let d=Math.hypot(e.x-hero.x,e.y-hero.y);if(d<td){td=d;target=e}}if(target&&td<hero.range&&hero.cd<=0){hero.cd=hero.rate;hero.angle=Math.atan2(target.y-hero.y,target.x-hero.x);hitEnemy(target,hero.damage);particles.push({x:hero.x,y:hero.y,vx:0,vy:0,life:.16,max:.16,color:'#ffe9a6',size:hero.range,arc:true,a:hero.angle})}
  for(const b of buildings){b.cd-=dt;if((b.type==='tower'||b.type==='fire')&&b.cd<=0){let t=null,d0=b.type==='tower'?245:125;for(const e of enemies){let d=Math.hypot(e.x-b.x,e.y-b.y);if(d<d0){d0=d;t=e}}if(t){b.cd=b.type==='tower'?1.15:.55;shots.push({x:b.x,y:b.y,tx:t.x,ty:t.y,target:t,speed:b.type==='tower'?420:290,damage:b.type==='tower'?18:9,type:b.type})}}}
  for(const e of enemies){e.flash=Math.max(0,e.flash-dt);e.cd-=dt;let target=keep,dist=Math.hypot(e.x-keep.x,e.y-keep.y);for(const b of buildings){let d=Math.hypot(e.x-b.x,e.y-b.y);if(d<dist){dist=d;target=b}}let dh=Math.hypot(e.x-hero.x,e.y-hero.y);if(dh<145&&dh<dist){dist=dh;target=hero}if(e.route&&e.routeIndex<e.route.length){let p=e.route[e.routeIndex],pd=Math.hypot(p[0]-e.x,p[1]-e.y);if(pd<26)e.routeIndex++;else{e.x+=(p[0]-e.x)/pd*e.speed*dt;e.y+=(p[1]-e.y)/pd*e.speed*dt;continue}}if(dist>e.r+(target.r||17)){e.x+=(target.x-e.x)/dist*e.speed*dt;e.y+=(target.y-e.y)/dist*e.speed*dt}else if(e.cd<=0){e.cd=e.boss?1.05:1.35;target.hp-=e.damage;target.flash=.13;burst(target.x,target.y,'#d45e48',8);damageNum(target.x,target.y-30,e.damage,'#ff8870');shake=e.boss?11:5}}
  enemies=enemies.filter(e=>!e.dead);buildings=buildings.filter(b=>b.hp>0);if(hero.hp<=0||keep.hp<=0)gameOver();else if(enemies.length===0&&phase==='night')setTimeout(()=>{if(phase==='night'&&enemies.length===0)daybreak()},700)
 }
